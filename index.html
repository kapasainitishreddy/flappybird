<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird - Power Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a14;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Segoe UI',system-ui,sans-serif;
  overflow:hidden;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
#gameWrap{
  position:relative;
  width:min(100vw,100vh*0.66);
  max-width:440px;
  aspect-ratio:9/14;
}
canvas{
  display:block;
  width:100%;height:100%;
  image-rendering:auto;
  border-radius:8px;
  box-shadow:0 0 60px rgba(80,180,255,0.15),0 0 120px rgba(255,180,40,0.08);
  cursor:pointer;
}
</style>
</head>
<body>
<div id="gameWrap"><canvas id="gc"></canvas></div>
<script>
// ============================================================
//  FLAPPY BIRD — POWER EDITION
//  Features: 3 Lives • Smash Power (10s) • Shield Guard • Duel Mode
// ============================================================
const C=document.getElementById('gc'),X=C.getContext('2d');
const W=440,H=680;
C.width=W;C.height=H;

// ─── CONSTANTS ───
const GRAVITY=0.32, FLAP_V=-6.8, PIPE_W=58, PIPE_GAP=205, PIPE_SPEED=1.8;
const PIPE_SPAWN=100, BIRD_X1=90, BIRD_X2=110, BIRD_R=14;
const GROUND_Y=H-56, CEIL_Y=0;
const SMASH_DURATION=600; // 10 seconds at 60fps

// ─── GAME STATE ───
const STATE={MENU:0,PLAYING_SINGLE:1,PLAYING_DUEL:2,GAMEOVER:3};
let state=STATE.MENU, frame=0, menuSel=0, shakeTimer=0, shakeX=0, shakeY=0;
let pipes=[], powerUps=[], particles=[], floatTexts=[];
let p1=null, p2=null, resultText='', resultSub='';
let gameOverTimeout=null; // track death animation timeout to prevent race conditions
let highScore=0; // persistent high score from localStorage
let bgmOn=true, bgmNodes=[], bgmGain=null, bgmLoopId=null; // background music state

// ─── ROUNDED RECT HELPER (compatible with all browsers) ───
function roundRect(x,y,w,h,r){
  X.beginPath();
  X.moveTo(x+r,y);X.lineTo(x+w-r,y);
  X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);
  X.closePath();
}

// ─── BIRD CLASS ───
function createBird(x,y,color,name){
  return{
    x,y,y0:y,vy:0,color,name,
    lives:3, score:0,
    shield:false, smashTimer:0,
    alive:true, blinkTimer:0,
    wingPhase:0, wingSpeed:0.25,
    trail:[]
  };
}

// ─── PIPE ───
function createPipe(x,gapY){
  return{x,gapY,passedP1:false,passedP2:false,shattered:false};
}

// ─── POWER-UP ───
function createPowerUp(x,y,type){
  return{x,y,type,vy:0,bobPhase:Math.random()*Math.PI*2,glow:0};
}

// ─── PARTICLE ───
function spawnParticles(x,y,count,color,speed,life){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, sp=speed*(0.4+Math.random()*0.6);
    particles.push({
      x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      color, life:life*(0.5+Math.random()*0.5), maxLife:life,
      size:1.5+Math.random()*3.5
    });
  }
}

// ─── FLOAT TEXT ───
function addFloatText(x,y,text,color,size){
  floatTexts.push({x,y,text,color,size:size||14,life:50,maxLife:50,vy:-1.5});
}

// ─── SOUND (Simple oscillator beeps) ───
let audioCtx=null;
function initAudio(){
  if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  if(bgmOn)startBGM();
}
function beep(freq,dur,vol,type){
  if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    g.gain.setValueAtTime(vol||0.06,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur+0.02);
  }catch(e){}
}
function sfxFlap(){beep(420,0.08,0.05,'triangle');}
function sfxScore(){beep(880,0.1,0.06,'square');setTimeout(()=>beep(1100,0.1,0.06,'square'),100);}
function sfxHit(){beep(80,0.2,0.08,'sawtooth');}
function sfxPowerUp(){beep(600,0.06,0.06,'triangle');setTimeout(()=>beep(900,0.06,0.06,'triangle'),60);setTimeout(()=>beep(1200,0.08,0.06,'triangle'),120);}
function sfxSmash(){beep(100,0.25,0.07,'sawtooth');setTimeout(()=>beep(200,0.15,0.05,'square'),100);}
function sfxShieldBreak(){beep(300,0.1,0.05,'triangle');setTimeout(()=>beep(200,0.15,0.05,'triangle'),80);}
function sfxDeath(){beep(200,0.15,0.06,'sawtooth');setTimeout(()=>beep(150,0.15,0.06,'sawtooth'),120);setTimeout(()=>beep(100,0.3,0.06,'sawtooth'),240);}
function sfxMenu(){beep(500,0.06,0.04,'triangle');}

// ─── BACKGROUND MUSIC (Looping chiptune) ───
function startBGM(){
  if(!audioCtx||!bgmOn)return;
  stopBGM();
  const now=audioCtx.currentTime;
  bgmGain=audioCtx.createGain();
  bgmGain.gain.setValueAtTime(0.025,now);
  bgmGain.connect(audioCtx.destination);
  // Simple chiptune melody pattern (8 bars, loops every ~6.4s)
  const notes=[262,330,392,330,262,294,330,262, 330,392,523,392,330,294,262,294, 262,330,392,330,262,294,330,392, 523,494,440,392,330,349,330,294];
  const beatLen=0.2;
  notes.forEach((freq,i)=>{
    const t=now+i*beatLen;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.frequency.setValueAtTime(freq,t);
    o.frequency.setValueAtTime(freq*0.995,t+beatLen*0.4); // slight detune
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.06,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+beatLen*0.8);
    o.connect(g);g.connect(bgmGain);
    o.start(t);o.stop(t+beatLen*0.9);
    bgmNodes.push(o,g);
  });
  // Loop after pattern ends
  const loopTime=notes.length*beatLen;
  bgmLoopId=setTimeout(()=>{if(bgmOn)startBGM();},loopTime*1000-100);
}
function stopBGM(){
  clearTimeout(bgmLoopId);bgmLoopId=null;
  bgmNodes.forEach(n=>{try{n.stop();}catch(e){}});
  bgmNodes=[];
  if(bgmGain){try{bgmGain.disconnect();}catch(e){}bgmGain=null;}
}
function toggleBGM(){
  bgmOn=!bgmOn;
  if(bgmOn){startBGM();}
  else{stopBGM();}
}
function drawMuteButton(){
  const mx=W-36, my=H-80;
  X.fillStyle='rgba(0,0,0,0.5)';
  X.beginPath();X.arc(mx+14,my+14,14,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(255,255,255,0.3)';
  X.lineWidth=1.5;
  X.beginPath();X.arc(mx+14,my+14,14,0,Math.PI*2);X.stroke();
  X.fillStyle='#fff';
  X.font='14px "Segoe UI",system-ui,sans-serif';
  X.textAlign='center';X.textBaseline='middle';
  X.fillText(bgmOn?'🔊':'🔇',mx+14,my+14);
}
function handleMuteClick(cx,cy){
  const mx=W-36, my=H-80;
  const dx=cx-(mx+14), dy=cy-(my+14);
  if(Math.sqrt(dx*dx+dy*dy)<16){toggleBGM();return true;}
  return false;
}

// ─── INPUT ───
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key==='i'||e.key==='I')e.preventDefault();
  handleInput(e.key);
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

C.addEventListener('click',e=>{
  initAudio();
  const rect=C.getBoundingClientRect();
  const cx=(e.clientX-rect.left)*(W/rect.width);
  const cy=(e.clientY-rect.top)*(H/rect.height);
  if(state===STATE.MENU){if(!handleMuteClick(cx,cy))handleMenuClick(cx,cy);}
  else if(state===STATE.PLAYING_DUEL){if(!handleMuteClick(cx,cy))handleDuelClick(cx);}
  else if(state===STATE.PLAYING_SINGLE){if(!handleMuteClick(cx,cy))flapBird(p1);}
  else if(state===STATE.GAMEOVER){if(!handleMuteClick(cx,cy))resetToMenu();}
});

function handleInput(key){
  initAudio();
  if(state===STATE.PLAYING_SINGLE){
    if(key===' '||key==='w'||key==='W'||key==='ArrowUp'||key==='ArrowDown')flapBird(p1);
  }else if(state===STATE.PLAYING_DUEL){
    if(key==='w'||key==='W'||key===' ')flapBird(p1);
    if(key==='ArrowUp')flapBird(p2);
  }else if(state===STATE.GAMEOVER){
    if(key===' '||key==='Enter'||key==='w'||key==='W'||key==='ArrowUp')resetToMenu();
  }else if(state===STATE.MENU){
    if(key==='ArrowUp'||key==='w'||key==='W'){menuSel=Math.max(0,menuSel-1);sfxMenu();}
    if(key==='ArrowDown'||key==='s'||key==='S'){menuSel=Math.min(1,menuSel+1);sfxMenu();}
    if(key===' '||key==='Enter')startGame();
  }
}

function handleMenuClick(cx,cy){
  // Button 1: Single Player (y: 334, height 48 -> 310 to 358)
  if(cy>=310&&cy<=358&&cx>=W/2-110&&cx<=W/2+110){menuSel=0;startGame();}
  // Button 2: Duel Mode (y: 398, height 48 -> 374 to 422)
  else if(cy>=374&&cy<=422&&cx>=W/2-110&&cx<=W/2+110){menuSel=1;startGame();}
}

function handleDuelClick(cx){
  // Left half = P1, Right half = P2
  if(cx<W/2)flapBird(p1);
  else flapBird(p2);
}

function flapBird(bird){
  if(!bird||!bird.alive)return;
  bird.vy=FLAP_V;
  bird.wingPhase=0;
  bird.wingSpeed=0.35;
  sfxFlap();
  // Trail particles
  spawnParticles(bird.x,bird.y+8,4,bird.color,1.5,15);
}

// ─── GAME LOGIC ───
function startGame(){
  initAudio();
  if(gameOverTimeout){clearTimeout(gameOverTimeout);gameOverTimeout=null;}
  pipes=[];powerUps=[];particles=[];floatTexts=[];
  shakeTimer=0;shakeX=0;shakeY=0;frame=0;
  if(menuSel===0){
    state=STATE.PLAYING_SINGLE;
    p1=createBird(BIRD_X1,H/2,'#ff5544','P1');
    p2=null;
    // Spawn initial pipe sooner
    pipes.push(createPipe(W+80,200+Math.random()*250));
  }else{
    state=STATE.PLAYING_DUEL;
    p1=createBird(BIRD_X1,H/2-30,'#ff5544','P1');
    p2=createBird(BIRD_X2,H/2+10,'#44aaff','P2');
    pipes.push(createPipe(W+80,180+Math.random()*270));
  }
}

function resetToMenu(){
  if(gameOverTimeout){clearTimeout(gameOverTimeout);gameOverTimeout=null;}
  state=STATE.MENU;menuSel=0;frame=0;
  pipes=[];powerUps=[];particles=[];floatTexts=[];
  p1=null;p2=null;resultText='';resultSub='';
}

function gameOver(bird,otherBird){
  if(!bird.alive)return;
  bird.alive=false;
  sfxDeath();
  spawnParticles(bird.x,bird.y,25,bird.color,4,40);
  shakeTimer=15;

  const allBirds=[p1,p2].filter(b=>b!==null);
  const allDead=allBirds.every(b=>!b.alive);

  if(allDead){
    // Determine winner
    gameOverTimeout=setTimeout(()=>{
      gameOverTimeout=null;
      state=STATE.GAMEOVER;
      if(p1&&p2){
        if(!p1.alive&&!p2.alive){
          if(p1.score>p2.score){resultText='🟠 P1 WINS!';resultSub=`Score: ${p1.score} vs ${p2.score}`;}
          else if(p2.score>p1.score){resultText='🔵 P2 WINS!';resultSub=`Score: ${p2.score} vs ${p1.score}`;}
          else{resultText="IT'S A TIE!";resultSub=`Both scored ${p1.score}`;}
        }else if(!p1.alive){resultText='🔵 P2 WINS!';resultSub=`P2 survived! Score: ${p2.score}`;}
        else{resultText='🟠 P1 WINS!';resultSub=`P1 survived! Score: ${p1.score}`;}
      }else if(p1){
        resultText='GAME OVER';
        resultSub=`Final Score: ${p1.score}`;
        // Check & save high score (single player only)
        if(p1.score>highScore){highScore=p1.score;try{localStorage.setItem('flappyHighScore',highScore);}catch(e){}}
      }
    },600);
  }else{
    // Only one bird died, add float text
    addFloatText(bird.x,bird.y,'💀',bird.color,20);
  }
}

function hitBird(bird,pipe){
  if(!bird.alive)return;

  // Smash power active - destroy the pipe
  if(bird.smashTimer>0){
    if(!pipe.shattered){
      pipe.shattered=true;
      pipe.passedP1=true;pipe.passedP2=true; // prevent scoring on invisible pipe
      spawnParticles(pipe.x+PIPE_W/2,pipe.gapY,30,'#ffaa00',5,35);
      sfxSmash();
      addFloatText(pipe.x+20,pipe.gapY,'💥','#ffaa00',18);
      shakeTimer=6;
    }
    return;
  }

  // Shield protection
  if(bird.shield){
    bird.shield=false;
    bird.blinkTimer=30;
    spawnParticles(bird.x,bird.y,15,'#88ccff',3,25);
    sfxShieldBreak();
    addFloatText(bird.x,bird.y-20,'🛡️','#88ccff',16);
    return;
  }

  // Lose a life
  bird.lives--;
  sfxHit();
  spawnParticles(bird.x,bird.y,15,'#ffffff',3,20);
  addFloatText(bird.x,bird.y-15,'-1 ❤️','#ff4444',16);

  if(bird.lives<=0){
    gameOver(bird,p1===bird?p2:p1);
  }else{
    // Brief invulnerability
    bird.blinkTimer=40;
    bird.shield=false;
    bird.smashTimer=0;
    shakeTimer=8;
  }
}

function collectPowerUp(bird,pu){
  if(!bird.alive)return;
  if(pu.type==='smash'){
    bird.smashTimer=SMASH_DURATION;
    bird.shield=false;
    spawnParticles(pu.x,pu.y,12,'#ffaa00',3,25);
    addFloatText(pu.x,pu.y,'🔥 SMASH!','#ff8800',16);
    sfxPowerUp();
  }else if(pu.type==='shield'){
    bird.shield=true;
    spawnParticles(pu.x,pu.y,10,'#88ccff',3,20);
    addFloatText(pu.x,pu.y,'🛡️ GUARD!','#88ccff',16);
    sfxPowerUp();
  }
}

function update(){
  frame++;

  if(state===STATE.MENU||state===STATE.GAMEOVER){
    // Still update particles
    updateParticles();
    updateFloatTexts();
    if(shakeTimer>0){shakeX=(Math.random()-0.5)*shakeTimer*1.2;shakeY=(Math.random()-0.5)*shakeTimer*1.2;shakeTimer--;}else{shakeX=0;shakeY=0;}
    return;
  }

  const birds=[p1,p2].filter(b=>b!==null);

  // Update birds
  birds.forEach(bird=>{
    if(!bird.alive)return;
    bird.vy+=GRAVITY;
    bird.y+=bird.vy;
    bird.wingPhase+=bird.wingSpeed;
    if(bird.wingPhase>1){bird.wingPhase-=1;bird.wingSpeed=0.2;}
    if(bird.blinkTimer>0)bird.blinkTimer--;
    if(bird.smashTimer>0){
      bird.smashTimer--;
      // Trail while smashing
      if(frame%3===0)spawnParticles(bird.x,bird.y,1,'#ffaa00',1,12);
    }

    // Add to trail
    bird.trail.push({x:bird.x,y:bird.y,life:8,maxLife:8});
    if(bird.trail.length>8)bird.trail.shift();

    // Ground/ceiling collision
    if(bird.y>=GROUND_Y-BIRD_R){
      bird.y=GROUND_Y-BIRD_R;
      if(bird.smashTimer<=0){
        if(bird.shield){bird.shield=false;spawnParticles(bird.x,bird.y,15,'#88ccff',3,20);sfxShieldBreak();addFloatText(bird.x,bird.y-15,'🛡️','#88ccff',14);}
        else{bird.lives=0;gameOver(bird,p1===bird?p2:p1);}
      }
    }
    if(bird.y<=CEIL_Y+BIRD_R){
      bird.y=CEIL_Y+BIRD_R;
      bird.vy=2;
      if(bird.smashTimer<=0){
        if(bird.shield){bird.shield=false;spawnParticles(bird.x,bird.y,15,'#88ccff',3,20);sfxShieldBreak();addFloatText(bird.x,bird.y-15,'🛡️','#88ccff',14);}
        else{bird.lives=0;gameOver(bird,p1===bird?p2:p1);}
      }
    }
  });

  // Update pipes
  pipes.forEach(pipe=>{
    pipe.x-=PIPE_SPEED;

    // Scoring
    birds.forEach(bird=>{
      if(!bird.alive)return;
      const passedKey=bird===p1?'passedP1':'passedP2';
      if(!pipe[passedKey]&&pipe.x+PIPE_W<bird.x){
        pipe[passedKey]=true;
        bird.score++;
        sfxScore();
        addFloatText(bird.x+30,bird.y-10,'+1',bird.color,16);
      }
    });

    // Collision
    if(!pipe.shattered){
      birds.forEach(bird=>{
        if(!bird.alive)return;
        if(bird.blinkTimer>0)return; // brief invuln after hit
        const bx=bird.x,by=bird.y,r=BIRD_R;
        const px=pipe.x,pw=PIPE_W,gy=pipe.gapY;

        // Check if bird is horizontally within pipe
        if(bx+r>px&&bx-r<px+pw){
          // Top pipe
          if(by-r<gy-PIPE_GAP/2){
            hitBird(bird,pipe);
          }
          // Bottom pipe
          if(by+r>gy+PIPE_GAP/2){
            hitBird(bird,pipe);
          }
        }
      });
    }
  });

  // Remove off-screen pipes
  pipes=pipes.filter(p=>p.x>-PIPE_W-20);

  // Spawn new pipes
  if(pipes.length===0||pipes[pipes.length-1].x<W-PIPE_SPAWN){
    const lastGap=pipes.length>0?pipes[pipes.length-1].gapY:H/2;
    let newGap=lastGap+(Math.random()-0.5)*180;
    newGap=Math.max(PIPE_GAP/2+30,Math.min(H-GROUND_Y-PIPE_GAP/2-30,newGap));
    pipes.push(createPipe(W+20,newGap));

    // Spawn power-up occasionally
    if(Math.random()<0.35){
      const puX=W+40+Math.random()*100;
      const puY=newGap-PIPE_GAP/2+40+Math.random()*(PIPE_GAP-80);
      const puType=Math.random()<0.5?'smash':'shield';
      powerUps.push(createPowerUp(puX,puY,puType));
    }
  }

  // Update power-ups
  powerUps.forEach(pu=>{
    pu.x-=PIPE_SPEED;
    pu.bobPhase+=0.06;
    pu.y+=Math.sin(pu.bobPhase)*0.4;

    // Collision with birds
    birds.forEach(bird=>{
      if(!bird.alive)return;
      const dx=bird.x-pu.x, dy=bird.y-pu.y;
      if(Math.sqrt(dx*dx+dy*dy)<BIRD_R+16){
        collectPowerUp(bird,pu);
        pu.collected=true;
      }
    });
  });
  powerUps=powerUps.filter(pu=>pu.x>-30&&!pu.collected);

  // Update particles
  updateParticles();
  updateFloatTexts();

  // Shake
  if(shakeTimer>0){shakeX=(Math.random()-0.5)*shakeTimer*1.2;shakeY=(Math.random()-0.5)*shakeTimer*1.2;shakeTimer--;}else{shakeX=0;shakeY=0;}

  // Update trails
  birds.forEach(bird=>{
    bird.trail.forEach(t=>t.life--);
    bird.trail=bird.trail.filter(t=>t.life>0);
  });
}

function updateParticles(){
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=0.08;
    p.life--;
  });
  particles=particles.filter(p=>p.life>0);
}
function updateFloatTexts(){
  floatTexts.forEach(ft=>{ft.y+=ft.vy;ft.life--;});
  floatTexts=floatTexts.filter(ft=>ft.life>0);
}

// ─── RENDER ───
function drawSky(){
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a2a5a');
  g.addColorStop(0.15,'#2a4a7a');
  g.addColorStop(0.4,'#4a8ab8');
  g.addColorStop(0.7,'#7ab8d8');
  g.addColorStop(1,'#a0d0e0');
  X.fillStyle=g;X.fillRect(0,0,W,H);

  // Stars (top)
  for(let i=0;i<25;i++){
    const sx=(i*67+13+frame*i*0.005)%W, sy=(i*43+7)%(H*0.18);
    const b=0.12+Math.sin(frame*0.015+i*1.7)*0.1;
    X.fillStyle=`rgba(255,255,255,${b})`;
    X.fillRect(sx,sy,i%3===0?2:1,i%3===0?2:1);
  }

  // Clouds
  for(let i=0;i<5;i++){
    const cx=((i*120+80)-frame*0.4)%(W+200)-100;
    const cy=30+i*40+Math.sin(frame*0.02+i)*8;
    const ca=0.18+Math.sin(frame*0.01+i)*0.06;
    X.fillStyle=`rgba(255,255,255,${ca})`;
    X.beginPath();X.arc(cx,cy,22+Math.sin(i)*8,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(cx+18,cy-5,16,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(cx+35,cy+2,14,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(cx-10,cy+5,12,0,Math.PI*2);X.fill();
  }
}

function drawPipe(pipe){
  if(pipe.shattered)return; // Don't draw shattered pipes
  const px=pipe.x, gy=pipe.gapY, hh=PIPE_GAP/2;
  const topH=gy-hh, botY=gy+hh;

  // Pipe gradient
  const pG=X.createLinearGradient(px,0,px+PIPE_W,0);
  pG.addColorStop(0,'#3a8a30');
  pG.addColorStop(0.3,'#6ac84a');
  pG.addColorStop(0.5,'#7adc5a');
  pG.addColorStop(0.7,'#5ab840');
  pG.addColorStop(1,'#2a6a20');

  // Top pipe
  X.fillStyle=pG;
  X.fillRect(px,0,PIPE_W,topH);
  // Pipe cap (top)
  X.fillStyle='#4aaa3a';
  X.fillRect(px-4,topH-22,PIPE_W+8,22);
  X.fillStyle='#5ac84a';
  X.fillRect(px-2,topH-20,PIPE_W+4,18);
  // Rim highlight
  X.fillStyle='rgba(255,255,255,0.15)';
  X.fillRect(px-2,topH-22,PIPE_W+4,3);
  X.fillStyle='rgba(0,0,0,0.2)';
  X.fillRect(px-2,topH-3,PIPE_W+4,3);

  // Bottom pipe
  X.fillStyle=pG;
  X.fillRect(px,botY,PIPE_W,H-GROUND_Y-botY);
  // Pipe cap (bottom)
  X.fillStyle='#4aaa3a';
  X.fillRect(px-4,botY,PIPE_W+8,22);
  X.fillStyle='#5ac84a';
  X.fillRect(px-2,botY+2,PIPE_W+4,18);
  // Rim highlight
  X.fillStyle='rgba(255,255,255,0.15)';
  X.fillRect(px-2,botY,PIPE_W+4,3);
  X.fillStyle='rgba(0,0,0,0.2)';
  X.fillRect(px-2,botY+19,PIPE_W+4,3);

  // Vertical lines on pipes
  X.fillStyle='rgba(0,0,0,0.08)';
  for(let lx=px+6;lx<px+PIPE_W;lx+=8){
    X.fillRect(lx,0,2,topH);
    X.fillRect(lx,botY,2,H-GROUND_Y-botY);
  }
}

function drawBird(bird){
  if(!bird.alive)return;

  const bx=bird.x, by=bird.y;
  const angle=Math.min(Math.max(bird.vy*0.08,-0.6),0.8);

  // Trail
  bird.trail.forEach(t=>{
    const a=t.life/t.maxLife*0.25;
    X.fillStyle=`rgba(255,255,255,${a})`;
    X.beginPath();X.arc(t.x,t.y,BIRD_R*a*0.6,0,Math.PI*2);X.fill();
  });

  // Blink effect - draw semi-transparent during invulnerability
  const isBlinking=bird.blinkTimer>0;
  const blinkAlpha=isBlinking?(Math.floor(bird.blinkTimer/3)%2===0?0.3:0.8):1;

  X.save();
  X.translate(bx,by);
  X.rotate(angle);
  X.globalAlpha=blinkAlpha;

  // Shield glow
  if(bird.shield){
    const sg=X.createRadialGradient(0,0,BIRD_R-2,0,0,BIRD_R+12);
    sg.addColorStop(0,'rgba(100,180,255,0.6)');
    sg.addColorStop(0.5,'rgba(80,150,255,0.3)');
    sg.addColorStop(1,'rgba(60,120,255,0)');
    X.fillStyle=sg;X.beginPath();X.arc(0,0,BIRD_R+12,0,Math.PI*2);X.fill();

    // Shield ring
    X.strokeStyle=`rgba(150,220,255,${0.5+Math.sin(frame*0.15)*0.3})`;
    X.lineWidth=2.5;
    X.beginPath();X.arc(0,0,BIRD_R+8,-Math.PI*0.7,Math.PI*1.7);X.stroke();

    // Small orbiting dots
    for(let i=0;i<3;i++){
      const a=frame*0.08+i*2.094;
      const ox=Math.cos(a)*(BIRD_R+9), oy=Math.sin(a)*(BIRD_R+9);
      X.fillStyle='rgba(200,240,255,0.8)';
      X.beginPath();X.arc(ox,oy,2.5,0,Math.PI*2);X.fill();
    }
  }

  // Smash glow
  if(bird.smashTimer>0){
    const sg=X.createRadialGradient(0,0,BIRD_R-3,0,0,BIRD_R+16);
    const si=bird.smashTimer/SMASH_DURATION;
    sg.addColorStop(0,`rgba(255,180,0,${0.7*si})`);
    sg.addColorStop(0.5,`rgba(255,120,0,${0.4*si})`);
    sg.addColorStop(1,'rgba(255,60,0,0)');
    X.fillStyle=sg;X.beginPath();X.arc(0,0,BIRD_R+16,0,Math.PI*2);X.fill();

    // Flame particles around bird
    for(let i=0;i<4;i++){
      const a2=frame*0.12+i*1.57;
      const fx=Math.cos(a2)*(BIRD_R+6), fy=Math.sin(a2)*(BIRD_R+6);
      X.fillStyle=`rgba(255,${150+Math.random()*105},0,0.6)`;
      X.beginPath();X.arc(fx,fy,2+Math.random()*2,0,Math.PI*2);X.fill();
    }
  }

  // Shadow
  X.fillStyle='rgba(0,0,0,0.2)';
  X.beginPath();X.ellipse(0,BIRD_R-1,BIRD_R*0.9,BIRD_R*0.25,0,0,Math.PI*2);X.fill();

  // Body
  const bG=X.createRadialGradient(-2,-2,BIRD_R*0.2,0,0,BIRD_R);
  bG.addColorStop(0,bird.color);
  bG.addColorStop(0.7,bird.color);
  bG.addColorStop(1,'#000000');
  X.fillStyle=bG;
  X.beginPath();X.arc(0,0,BIRD_R,0,Math.PI*2);X.fill();

  // Belly
  const beltG=X.createRadialGradient(2,3,BIRD_R*0.1,0,2,BIRD_R*0.7);
  beltG.addColorStop(0,'#fff8e8');
  beltG.addColorStop(1,'#eed8c0');
  X.fillStyle=beltG;
  X.beginPath();X.arc(1,3,BIRD_R*0.6,0,Math.PI*2);X.fill();

  // Wing
  const wf=bird.wingPhase*Math.PI*2;
  const wingDown=Math.sin(wf)*6;
  X.fillStyle=bird.color;
  X.beginPath();
  X.ellipse(-BIRD_R*0.1,2,BIRD_R*0.55,BIRD_R*0.35,0.1,0,Math.PI*2);
  X.fill();
  // Wing flap
  X.fillStyle=X.shadeBlend?X.shadeBlend(-0.2,bird.color):'#cc4433';
  X.beginPath();
  X.ellipse(-2,2+wingDown,BIRD_R*0.5,BIRD_R*0.3,-0.3,0,Math.PI*2);
  X.fill();

  // Eye (white)
  X.fillStyle='#fff';
  X.beginPath();X.arc(BIRD_R*0.25,-BIRD_R*0.2,BIRD_R*0.42,0,Math.PI*2);X.fill();
  // Pupil
  X.fillStyle='#111';
  X.beginPath();X.arc(BIRD_R*0.35,-BIRD_R*0.15,BIRD_R*0.22,0,Math.PI*2);X.fill();
  // Eye shine
  X.fillStyle='#fff';
  X.beginPath();X.arc(BIRD_R*0.4,-BIRD_R*0.28,BIRD_R*0.1,0,Math.PI*2);X.fill();

  // Beak
  X.fillStyle='#ff8800';
  X.beginPath();
  X.moveTo(BIRD_R*0.7,-BIRD_R*0.1);
  X.lineTo(BIRD_R*1.3,BIRD_R*0.1);
  X.lineTo(BIRD_R*0.7,BIRD_R*0.25);
  X.closePath();X.fill();
  X.fillStyle='#ffaa30';
  X.beginPath();
  X.moveTo(BIRD_R*0.7,-BIRD_R*0.05);
  X.lineTo(BIRD_R*1.25,BIRD_R*0.1);
  X.lineTo(BIRD_R*0.7,BIRD_R*0.15);
  X.closePath();X.fill();

  // Top feathers (tuft)
  X.fillStyle=bird.color;
  X.beginPath();
  X.moveTo(-BIRD_R*0.1,-BIRD_R*0.7);
  X.quadraticCurveTo(BIRD_R*0.2,-BIRD_R*1.4,BIRD_R*0.1,-BIRD_R*0.5);
  X.quadraticCurveTo(BIRD_R*0.15,-BIRD_R*1.2,BIRD_R*0.3,-BIRD_R*0.5);
  X.fill();

  // Tail
  X.fillStyle=bird.color;
  X.beginPath();
  X.moveTo(-BIRD_R*0.6,BIRD_R*0.2);
  X.quadraticCurveTo(-BIRD_R*1.4,BIRD_R*0.4,-BIRD_R*1.1,BIRD_R*0.9);
  X.quadraticCurveTo(-BIRD_R*0.6,BIRD_R*0.7,-BIRD_R*0.6,BIRD_R*0.2);
  X.fill();

  X.restore();
}

function drawPowerUp(pu){
  const px=pu.x, py=pu.y;
  const bob=Math.sin(pu.bobPhase)*3;

  // Glow
  const color=pu.type==='smash'?'#ffaa00':'#44aaff';
  const g=X.createRadialGradient(px,py+bob,4,px,py+bob,18);
  g.addColorStop(0,color);
  g.addColorStop(1,'transparent');
  X.fillStyle=g;X.globalAlpha=0.35+Math.sin(frame*0.08)*0.15;
  X.beginPath();X.arc(px,py+bob,18,0,Math.PI*2);X.fill();
  X.globalAlpha=1;

  // Outer ring
  X.strokeStyle=color;
  X.lineWidth=2.5;
  X.beginPath();X.arc(px,py+bob,13,0,Math.PI*2);X.stroke();
  X.strokeStyle='rgba(255,255,255,0.5)';
  X.lineWidth=1;
  X.beginPath();X.arc(px,py+bob,11,0,Math.PI*2);X.stroke();

  // Center icon
  X.fillStyle='#fff';
  X.font='bold 16px "Segoe UI",system-ui,sans-serif';
  X.textAlign='center';X.textBaseline='middle';
  X.fillText(pu.type==='smash'?'🔥':'🛡️',px,py+bob);

  // Rotating highlight
  const ha=frame*0.06;
  X.fillStyle='rgba(255,255,255,0.4)';
  X.beginPath();
  X.arc(px+Math.cos(ha)*6,py+bob+Math.sin(ha)*6,3,0,Math.PI*2);
  X.fill();
}

function drawPowerIndicators(bird,x,y,w){
  w=w||80;
  // Smash indicator
  if(bird.smashTimer>0){
    const secLeft=Math.ceil(bird.smashTimer/60);
    const pct=bird.smashTimer/SMASH_DURATION;
    // Background bar
    X.fillStyle='rgba(0,0,0,0.5)';
    X.fillRect(x,y,w,10);
    X.strokeStyle='rgba(255,150,0,0.4)';
    X.lineWidth=1;
    X.strokeRect(x,y,w,10);
    // Fill
    const fillW=(w-2)*pct;
    const fG=X.createLinearGradient(x,0,x+fillW,0);
    fG.addColorStop(0,'#ff8800');fG.addColorStop(1,'#ffcc00');
    X.fillStyle=fG;
    X.fillRect(x+1,y+1,fillW,8);
    // Text
    X.fillStyle='#fff';
    X.font='bold 7px "Segoe UI",system-ui,sans-serif';
    X.textAlign='center';X.textBaseline='middle';
    X.fillText(`🔥${secLeft}s`,x+w/2,y+5);
  }
  // Shield indicator
  if(bird.shield){
    const sy=bird.smashTimer>0?y+13:y;
    X.fillStyle='rgba(0,0,0,0.5)';
    X.fillRect(x,sy,w,10);
    X.strokeStyle='rgba(100,180,255,0.4)';
    X.lineWidth=1;
    X.strokeRect(x,sy,w,10);
    X.fillStyle='rgba(80,160,255,0.5)';
    X.fillRect(x+1,sy+1,w-2,8);
    X.fillStyle='#fff';
    X.font='bold 7px "Segoe UI",system-ui,sans-serif';
    X.textAlign='center';X.textBaseline='middle';
    X.fillText('🛡️GUARD',x+w/2,sy+5);
  }
}

  drawMuteButton();
}

function drawMenuButton(x,y,text,selected,w,h){
  w=w||280;h=h||42;
  const hw=w/2, hh=h/2;
  X.fillStyle=selected?'rgba(255,200,40,0.25)':'rgba(0,0,0,0.45)';
  roundRect(x-hw,y-hh,w,h,10);X.fill();
  X.strokeStyle=selected?'#ffcc44':'rgba(255,255,255,0.2)';
  X.lineWidth=selected?2.5:1.5;
  roundRect(x-hw,y-hh,w,h,10);X.stroke();

  if(selected){
    X.fillStyle='rgba(255,200,40,0.15)';
    roundRect(x-hw+2,y-hh+2,w-4,h-4,9);X.fill();
  }

  X.fillStyle=selected?'#fff':'rgba(255,255,255,0.75)';
  X.font='bold 16px "Segoe UI",system-ui,sans-serif';
  X.textAlign='center';X.textBaseline='middle';
  X.fillText(text,x,y+1);

  if(selected){
    X.fillStyle='#ffcc44';
    X.font='14px "Segoe UI",system-ui,sans-serif';
    X.fillText('▶',x+hw-16,y+1);
  }
}

function drawGameOver(){
  drawSky();
  drawGround();

  // Overlay
  X.fillStyle='rgba(0,0,0,0.65)';
  X.fillRect(0,0,W,H);

  // Panel
  const py=H*0.28;
  X.fillStyle='rgba(15,10,30,0.9)';
  roundRect(W/2-150,py-20,300,200,12);X.fill();
  X.strokeStyle='rgba(255,200,40,0.4)';
  X.lineWidth=2;
  roundRect(W/2-150,py-20,300,200,12);X.stroke();

  // Result
  X.fillStyle='#ffcc44';
  X.font='bold 28px "Segoe UI",system-ui,sans-serif';
  X.textAlign='center';X.textBaseline='middle';
  X.fillText(resultText,W/2,py+20);

  X.fillStyle='rgba(255,255,255,0.7)';
  X.font='14px "Segoe UI",system-ui,sans-serif';
  X.fillText(resultSub,W/2,py+55);

  // Stats (single player)
  if(p1&&!p2){
    X.fillStyle='#fff';
    X.font='bold 40px "Segoe UI",system-ui,sans-serif';
    X.fillText(p1.score,W/2,py+100);
    X.fillStyle='rgba(255,255,255,0.5)';
    X.font='14px "Segoe UI",system-ui,sans-serif';
    X.fillText('Score',W/2,py+125);
    // High score
    const hs=p1.score>=highScore&&p1.score>0?p1.score:highScore;
    const isNew=p1.score>=highScore&&p1.score>0;
    X.fillStyle=isNew?'#ffcc44':'rgba(255,255,255,0.35)';
    X.font='bold 13px "Segoe UI",system-ui,sans-serif';
    X.fillText(`🏆 Best: ${hs}${isNew?' NEW!':''}`,W/2,py+148);
  }

  // Restart hint
  if(Math.sin(frame*0.06)>0){
    X.fillStyle='rgba(255,255,255,0.6)';
    X.font='bold 13px "Segoe UI",system-ui,sans-serif';
    X.textAlign='center';X.textBaseline='middle';
    X.fillText('Tap or Press SPACE to Return',W/2,py+165);
  }

  // Mute button
  drawMuteButton();
}

function drawParticlesAndTexts(){
  // Particles
  particles.forEach(p=>{
    const a=p.life/p.maxLife;
    X.globalAlpha=a;
    X.fillStyle=p.color;
    X.fillRect(p.x,p.y,p.size,p.size);
  });
  X.globalAlpha=1;

  // Float texts
  floatTexts.forEach(ft=>{
    const a=ft.life/ft.maxLife;
    X.globalAlpha=a;
    X.fillStyle=ft.color;
    X.font=`bold ${ft.size}px "Segoe UI",system-ui,sans-serif`;
    X.textAlign='center';X.textBaseline='middle';
    X.fillText(ft.text,ft.x,ft.y);
    X.fillStyle='rgba(0,0,0,0.4)';
    X.fillText(ft.text,ft.x+1,ft.y+1);
  });
  X.globalAlpha=1;
}

// ─── RENDER ───
function render(){
  X.clearRect(0,0,W,H);
  X.save();
  X.translate(shakeX,shakeY);

  if(state===STATE.MENU){
    drawMenu();
    drawParticlesAndTexts();
  }else if(state===STATE.GAMEOVER){
    drawGameOver();
    drawParticlesAndTexts();
  }else{
    // Game scenes
    drawSky();

    // Pipes
    pipes.forEach(pipe=>drawPipe(pipe));

    // Power-ups
    powerUps.forEach(pu=>drawPowerUp(pu));

    drawGround();

    // Birds
    if(p1)drawBird(p1);
    if(p2)drawBird(p2);

    drawParticlesAndTexts();
    drawUI();
  }

  X.restore();
}

// ─── GAME LOOP ───
function gameLoop(){
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ─── INIT ───
function init(){
  highScore=parseInt(localStorage.getItem('flappyHighScore'))||0;
  resetToMenu();
  requestAnimationFrame(gameLoop);
}

// ShadeBlend polyfill for darker colors
CanvasRenderingContext2D.prototype.shadeBlend=function(p,c){
  if(!c||c.startsWith('rgba')||c.startsWith('hsl'))return c;
  const r=parseInt(c.slice(1,3),16)||0,g=parseInt(c.slice(3,5),16)||0,b=parseInt(c.slice(5,7),16)||0;
  if(p>=0){const f=1+p*3;return `rgb(${Math.min(255,Math.round(r+(255-r)*(f-1)))},${Math.min(255,Math.round(g+(255-g)*(f-1)))},${Math.min(255,Math.round(b+(255-b)*(f-1)))})`;}
  const f=1+p*3;return `rgb(${Math.max(0,Math.round(r*f))},${Math.max(0,Math.round(g*f))},${Math.max(0,Math.round(b*f))})`;
};

init();
</script>
